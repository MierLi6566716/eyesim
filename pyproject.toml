[project]
name = "eyesim"
version = "0.6.0"
description = "Measure a prescription from infrared eye photos, and simulate what it does to vision."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pillow>=9.0"]
ml  = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eyesim"]